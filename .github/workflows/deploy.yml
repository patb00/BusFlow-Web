name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these; the build job only reads the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push supersedes one that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site lives in a subdirectory on Pages, and canonical/sitemap URLs must match it.
      VITE_BASE: /BusFlow-Web/
      VITE_SITE_URL: https://patb00.github.io/BusFlow-Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # 404.html is what makes client-side routes work on a static host, and Pages only serves
      # it from the site root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

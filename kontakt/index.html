<title>Kontakt – BusFlow</title>
<meta name="robots" content="noindex">
<script>
/* /kontakt: Anfrage auf Deutsch; ?lang=hr|en oder ein kroatischer bzw. englischer Browser → Anfrage in dieser Sprache
   (?lang hat Vorrang). Parameter und # bleiben erhalten. */
(function () {
  var q = /(?:^|[?&])lang=(de|hr|en)(?:&|$)/i.exec(location.search);
  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "";
  var lang = q ? q[1].toLowerCase() : /^hr\b/i.test(nav) ? "hr" : /^en\b/i.test(nav) ? "en" : "de";
  location.replace({ de: "../upit.html", hr: "../hr/upit.html", en: "../en/upit.html" }[lang] + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../upit.html"></noscript>
</head>

</body>
